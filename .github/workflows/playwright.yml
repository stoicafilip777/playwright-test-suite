name: Playwright Tests

on:
  push:
    branches: [ main ]

jobs:
  playwrighttests:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.51.0-jammy
      env:
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Run tests
        run: |
          echo "Start the shopping store application"
          chmod +x ./shopping-store-linux-amd64
          ./shopping-store-linux-amd64 &          # start app in background  
          APP_PID=$!                              # store PID to kill later 
          npx wait-on http://localhost:2221       # wait until server responds
          echo "Server is up, running tests"
          npm ci
          npm run test:ci
          kill $APP_PID                            # stop the server after tests

          
                  